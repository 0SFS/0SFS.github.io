<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#080e14" />
    <!-- Home Screen launches have no browser bars; iPhone Safari has no page fullscreen. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="OSFS" />
    <title>OSFS — Open Source Flight Simulator</title>
    <script>
      // Keep the first-paint log useful if the module bundle itself cannot load.
      addEventListener("error", function (event) {
        if (event.target !== window && !(event.target instanceof HTMLScriptElement)) return;
        document.getElementById("app-log-error")?.removeAttribute("hidden");
      }, true);
    </script>
    <style>
      /* Paint immediately, before the application or its styles download. Mirrors src/log/gameLog.css. */
      html, body { margin: 0; background: #080e14; }
      .game-log { position: fixed; z-index: 25; top: calc(84px + env(safe-area-inset-top, 0px)); left: calc(12px + env(safe-area-inset-left, 0px)); box-sizing: border-box; display: flex; flex-direction: column; align-items: flex-start; gap: 3px; width: max-content; max-width: min(380px, calc(100vw - 88px)); color: #ecf1f4; font: 12px/1.4 ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
      @media (min-width: 884px) { .game-log { top: calc(12px + env(safe-area-inset-top, 0px)); left: 50%; max-width: clamp(220px, calc(100vw - 688px), 560px); transform: translateX(-50%); } }
      .game-log [hidden] { display: none !important; }
      .game-log__line { box-sizing: border-box; width: fit-content; max-width: 100%; padding: 4px 8px; border-radius: 6px; background: rgba(4, 7, 11, 0.66); }
      .game-log__line[data-tone="error"] { color: #ffd1c9; background: rgba(58, 18, 16, 0.84); }
      .game-log a { color: #e8b647; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="app-log" class="game-log" role="log" aria-label="Game log" aria-relevant="additions">
      <div id="app-log-error" class="game-log__line" data-tone="error" hidden>The application could not download. Check your connection, then <a href="">reload and try again</a>.</div>
      <div class="game-log__line">Downloading the application…</div>
      <div class="game-log__line">OSFS · Open Source Flight Simulator</div>
      <noscript><div class="game-log__line">OSFS needs JavaScript enabled to load the simulator.</div></noscript>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
